<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pedido de Fotos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    @font-face {
  font-family: 'Funkies';
  src: url('/static/fonts/Funkies.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
body {
    font-family: "Poppins", sans-serif;
    margin: 0;
    padding: 20px 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #0d1b1e, #0f3b3e);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    overflow-x: hidden;
    color: #fff;
}


    /* Fondo difuminado con imagen */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://i.imgur.com/8i3HqzU.jpg') center/cover no-repeat;
      opacity: 0.15;
      filter: blur(6px);
      z-index: 0;
    }

.container {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 22px;
    padding: 50px 40px;
    max-width: 500px;
    width: 92%;
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    animation: fadeIn 0.8s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: all 0.3s ease;
}
.container:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: translateY(-3px);
}


    h1 {
      text-align: center;
      font-weight: 600;
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 25px;
      letter-spacing: 0.5px;
    }

    /* Firma mejorada */
    .firma {
      text-align: center;
      font-family: "Funkies", "Great Vibes", cursive;
      font-size: 2.6rem;
      color: #2cb5a0;
      margin-bottom: 15px;
      letter-spacing: 1px;
      text-shadow: 0 0 6px rgba(44, 181, 160, 0.4);
      transform: rotate(-1deg);
      user-select: none;
    }

    form {
      width: 100%;
    }

    label {
      display: block;
      font-weight: 500;
      margin: 12px 0 4px;
      color: #e1e1e1;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    select option {
      color: #333;
      background-color: #fff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 6px rgba(77, 238, 229, 0.5);
    }

    textarea {
      min-height: 70px;
      max-height: 120px;
      resize: vertical;
    }

    input[type="file"] {
      margin-top: 8px;
      font-size: 14px;
      color: #ddd;
    }

    button {
      width: 100%;
      background: linear-gradient(90deg, #2cb5a0, #0d7377);
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 25px;
      transition: background 0.3s ease;
      letter-spacing: 0.5px;
    }

    button:hover {
      background: linear-gradient(90deg, #33e1c4, #0d7377);
    }

    .hint {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      margin-top: 15px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  @media (max-width: 480px) {
  .container {
    padding: 30px 20px;
    max-width: 95%;
  }

  h1 {
    font-size: 1.4rem;
  }

  .firma {
    font-size: 2rem;
  }
}
  </style>
</head>
<body>
  <div class="container">
    <div class="firma">dzn.mark</div>
    <h1>Pedido de Impresión de Fotos</h1>
    <form action="/enviar" method="post" enctype="multipart/form-data">
      <label>Nombre del cliente</label>
      <input type="text" name="nombre" placeholder="Ej: Juan Pérez" required />

      <label>Cantidad total de fotos</label>
      <input type="number" name="cantidad" min="1" step="1" placeholder="Ej: 36" required />

      <label>Tipo / Calidad de papel</label>
      <select name="papel">
        <option value="Brillante">Brillante</option>
        <option value="Mate">Mate</option>
        <option value="Satinado">Satinado</option>
      </select>

      <label>Observaciones</label>
      <textarea name="observaciones" placeholder="Ej: mezclar color y B&N, entregar en sobre..."></textarea>

      <label>Seleccioná tus fotos</label>
      <input type="file" name="fotos" multiple accept="image/*" required />

      <button type="submit">Enviar pedido</button>
    </form>
    <p class="hint">Formato interno 32×47 cm — 9 fotos 10×15 cm</p>
  </div>
</body>
</html>
