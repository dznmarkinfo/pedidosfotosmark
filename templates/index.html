<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pedido de Fotos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* === PALETA ===
Beige fondo: #E9DFD1
Beige claro inputs: #EEDFCC
Verde oscuro: #2A3D40
Verde suave: #395B64
Texto gris oscuro: #2B2B2B
*/

body {
    font-family: 'Poppins', sans-serif;
    background-color: #E9DFD1;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center; 
    align-items: flex-start; /* Para que no quede demasiado arriba/abajo */
    min-height: 100vh;
}

/* Contenedor principal del formulario */
.container {
    width: 90%;
    max-width: 540px;
    background: #FFFFFF;
    padding: 35px;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    margin-top: 40px; /* separarlo del borde superior */
}

/* Inputs modernos y centrados */
input, select, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #C2A992;
    background-color: #E6D5C3;
    font-size: 15px;
}

/* Firma */
.firma {
    font-family: 'Great Vibes', cursive;
    font-size: 26px;
    color: #2A3D40;
    margin-bottom: 10px;
}

/* Título principal */
h1 {
    text-align: left;
    font-size: 26px;
    color: #2A3D40;
    margin-top: 0;
    margin-bottom: 30px;
}

/* Labels */
label {
    font-weight: 600;
    color: #2A3D40;
    margin-bottom: 6px;
    display: block;
}

/* Inputs */
input, select, textarea {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #EEDFCC;
    color: #2B2B2B;
    font-size: 15px;
    margin-bottom: 20px;
    outline: none;
}

input::placeholder,
textarea::placeholder {
    color: #6B6B6B;
}

/* Botón */
button {
    width: 100%;
    padding: 15px;
    background: #2A3D40;
    color: white;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 10px;
}

button:hover {
    background: #395B64;
}

/* Texto formato hoja */
.hint {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    color: #2B2B2B;
}
</style>
</head>
<body>
  <div class="container">
    <div class="firma">dzn.mark</div>
    <h1>Pedido de Impresión de Fotos</h1>
    <form action="/enviar" method="post" enctype="multipart/form-data">
      <label>Nombre del cliente</label>
      <input type="text" name="nombre" placeholder="Ej: Juan Pérez" required />

      <label>Cantidad total de fotos</label>
      <input type="number" name="cantidad" min="1" step="1" placeholder="Ej: 36" required />

      <label>Tipo / Calidad de papel</label>
      <select name="papel">
        <option value="Brillante">Brillante</option>
        <option value="Mate">Mate</option>
        <option value="Satinado">Satinado</option>
      </select>

      <label>Observaciones</label>
      <textarea name="observaciones" placeholder="Ej: mezclar color y B&N, entregar en sobre..."></textarea>

      <label>Seleccioná tus fotos</label>
      <input type="file" name="fotos" multiple accept="image/*" required />

      <button type="submit">Crear Pedido</button>
    </form>
    <p class="hint">Formato interno 32×47 cm — 9 fotos 10×15 cm aprox.</p>
  </div>
</body>
</html>
